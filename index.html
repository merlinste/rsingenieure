<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R+S Ingenieurbüro — Ganzheitliche Energieberatung</title>
  <meta name="description" content="R+S Ingenieurbüro Frankfurt — Energieberatung, Heizung & Wärmepumpe, Photovoltaik & Batteriespeicher, Klimatisierung. Förderung, GEG-Nachweise, Sanierungsplanung." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..500;1,300..500&family=Cormorant+Garamond:ital,wght@0,300..500;1,300..500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Hidden static forms for Netlify build crawler.
       Netlify scans index.html for forms at deploy time and creates them
       in the dashboard. The actual user-facing forms are rendered by React
       and post here via fetch(). -->
  <form name="kontakt" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="vorname" />
    <input type="text" name="nachname" />
    <input type="email" name="email" />
    <input type="tel" name="telefon" />
    <input type="text" name="anliegen" />
    <textarea name="nachricht"></textarea>
    <input type="text" name="bot-field" />
  </form>
  <form name="termin" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="vorname" />
    <input type="text" name="nachname" />
    <input type="email" name="email" />
    <input type="tel" name="telefon" />
    <input type="text" name="anliegen" />
    <input type="text" name="termin" />
    <textarea name="nachricht"></textarea>
    <input type="text" name="bot-field" />
  </form>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/shared.jsx"></script>
  <script type="text/babel" src="components/home.jsx"></script>
  <script type="text/babel" src="components/services.jsx"></script>
  <script type="text/babel" src="components/misc.jsx"></script>
  <script type="text/babel" src="components/cookie.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
